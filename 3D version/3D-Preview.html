<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Gems! 3D Edition — Live WebGL Showcase</title>
<style>
  body { margin: 0; background: #0d0a1a; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: #f8fafc; }
  h2 { margin: 12px 0 8px; color: #f472b6; letter-spacing: 1px; }
  canvas { border-radius: 12px; border: 2px solid #f472b6; box-shadow: 0 10px 36px rgba(0,0,0,0.6); }
</style>
</head>
<body>
  <h2>💎 CRYSTAL GEMS! 3D EDITION — LIVE WEBGL 3D ENGINE PREVIEW</h2>
  <canvas id="c3d" width="1280" height="640"></canvas>
  <script>window.__suGameInitialized = true;</script>
  <script src="src/modules/09-3d-engine.js"></script>
  <script>
    window.addEventListener('load', () => {
      const canvas = document.getElementById('c3d');
      const engine = new window.Crystal3DEngine(canvas);
      engine.camMode = 1; // 3D Isometric Diorama View!
      const heroes = ['steven', 'garnet', 'amethyst', 'pearl', 'bismuth', 'peridot', 'lapis', 'rose', 'connie', 'jasper'];
      const mockGame = {
        stageIndex: 0,
        gameMode: 'story',
        cameraX: 0,
        cameraZoom: 0.85,
        playerMode: '1p',
        environment: {
          getPlatforms: () => [
            { x: 260, y: 420, width: 240 },
            { x: 760, y: 390, width: 260 }
          ]
        },
        pickups: [
          { x: 380, y: 400, type: 'cookie' },
          { x: 890, y: 370, type: 'heart' }
        ],
        projectiles: [
          { x: 210, y: 510, radius: 22, type: 'stevenShield', color: '#ff6097' },
          { x: 640, y: 480, radius: 18, type: 'pearlLaser', color: '#22d3ee' }
        ],
        enemyManager: {
          enemies: [
            { type: 'boss_centipeetle', x: 1020, y: 580, facing: -1, isBoss: true, gemColor: '#22c55e', hurtTimer: 0 },
            { type: 'boss_white_diamond', x: 1160, y: 580, facing: -1, isBoss: true, gemColor: '#ffffff', hurtTimer: 0 }
          ]
        },
        player: { x: 120, y: 580, groundY: 580, stageWidth: 1600, facing: 1, activeChar: 'steven', isShielding: true, bubbleTimer: 1, vx: 0 }
      };
      engine.renderWorld(mockGame, 0, 0);
      // Also render the rest of the Crystal Gems standing in the 3D scene!
      const S = 1 / 50, groundY = 580, t = 1.2;
      heroes.slice(1).forEach((id, i) => {
        engine.drawHero3D({
          x: 220 + i * 82,
          y: (i === 2 || i === 6) ? 420 : 580,
          facing: 1,
          activeChar: id,
          vx: 0,
          isAttacking: (i === 1 || i === 3 || i === 4),
          actionTimer: 0.12,
          actionDuration: 0.25
        }, groundY, S, t);
      });
      if (engine.isSoftware3D) engine.flushSoftware3D();
    });
  </script>
</body>
</html>
