<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Gems! — Official Visual Effects & Particle Engine Reference</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0816;
    color: #f8fafc;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .header {
    text-align: center;
    padding: 18px 24px 12px;
    background: linear-gradient(180deg, rgba(56,189,248,0.18) 0%, rgba(11,8,22,0) 100%);
    border-bottom: 1px solid rgba(56,189,248,0.3);
  }
  .header h1 {
    margin: 0;
    font-size: 25px;
    letter-spacing: 1.4px;
    color: #38bdf8;
    text-shadow: 0 2px 12px rgba(56,189,248,0.45);
  }
  .header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #cbd5e1;
  }
  #effectsCanvas {
    display: block;
    margin: 14px auto 24px;
    border-radius: 14px;
    border: 1px solid rgba(148,163,184,0.22);
    box-shadow: 0 12px 38px rgba(0,0,0,0.65);
    background: #100c20;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>✨ CRYSTAL GEMS! — PROCEDURAL COMBAT VFX &amp; UI EFFECTS REFERENCE</h1>
    <p>100% Real-Time HTML5 Canvas 2D Particle Emitters (`ParticleSystem`) • Spinel Heart HP/DEF Gradual Drain • Elemental Status Riders • Revival Pillars</p>
  </div>
  <canvas id="effectsCanvas" width="1560" height="1020"></canvas>

  <script>window.__suGameInitialized = true;</script>
  <script src="../src/game.js"></script>
  <script>
  window.addEventListener('load', () => {
    const canvas = document.getElementById('effectsCanvas');
    const ctx = canvas.getContext('2d');

    const CELLS = [
      { title: '1. 4-POINT DIAMOND HIT SPARK & CRIT', sub: 'addHitSpark() + Critical Damage Text ("148!")', color: '#f43f5e' },
      { title: '2. PERFECT PARRY CLASH & ROSE DOME', sub: 'addParryClash() + Hexagonal Hard-Light Lattice', color: '#f472b6' },
      { title: '3. DOUBLE-SLASH X-CROSS & SWORD ARC', sub: 'addDoubleSlash() + Rose Broadsword / Spear Arc', color: '#38bdf8' },
      { title: '4. HEAVY LANDING & SHOCKWAVE RING', sub: 'addHeavyLanding() + Expanding Ground Ring', color: '#fb923c' },
      { title: '5. SPINEL HEART HP/DEF GRADUAL DRAIN', sub: 'Full Heart -> Dimming Drain -> Blacked Out -> Healed', color: '#ec4899' },
      { title: '6. 11-TYPE ELEMENTAL STATUS RIDERS', sub: '2x SUPER EFFECTIVE! • Overload • Scorch • Soak', color: '#facc15' },
      { title: '7. CORRUPTED GEM POOF & BUBBLE', sub: 'addPoof() Cloud + Auto-Bubbled Core', color: '#a855f7' },
      { title: '8. PINK OVERDRIVE / GEM SURGE AURA', sub: '1.9s Anime Cut-In Speed Lines & Starlight Burst', color: '#e879f9' },
      { title: '9. 2P 18s FLOATING GEM & 3s REFORM BEAM', sub: 'Floating Gemstone + 3s Hard-Light Reformation Pillar', color: '#22d3ee' },
      { title: '10. HOMEWORLD DESTABILIZER FIELD', sub: '450ms Throttled Electric Barrier Hazard', color: '#fde047' },
      { title: '11. BOSS THREAT AURA & HOMING ORBS', sub: 'Crimson Phase-2 Boss Aura + Tracking Projectiles', color: '#ef4444' },
      { title: '12. DODGE DASH AFTER-IMAGE & BOUNCE', sub: 'Invulnerability Ghost Trail + Super Bounce Pad', color: '#4ade80' }
    ];

    function drawSpinelGem(ctx, cx, cy, size, fillAlpha, isBlackedOut, label) {
      ctx.save();
      ctx.translate(cx, cy);
      // Outer facet frame
      ctx.beginPath();
      ctx.moveTo(0, size * 0.55);
      ctx.bezierCurveTo(-size * 0.85, -size * 0.05, -size * 0.55, -size * 0.72, 0, -size * 0.32);
      ctx.bezierCurveTo(size * 0.55, -size * 0.72, size * 0.85, -size * 0.05, 0, size * 0.55);
      ctx.closePath();

      if (isBlackedOut) {
        ctx.fillStyle = '#18181b';
        ctx.fill();
        ctx.strokeStyle = '#52525b';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = '#1f1629';
        ctx.fill();
        // Clip and fill up to fillAlpha (gradual HP/DEF drain!)
        ctx.save();
        ctx.clip();
        const topY = -size * 0.75 + (1 - fillAlpha) * (size * 1.35);
        const g = ctx.createLinearGradient(0, -size * 0.7, 0, size * 0.6);
        g.addColorStop(0, '#ff4d94');
        g.addColorStop(0.5, '#e11d48');
        g.addColorStop(1, '#881337');
        ctx.globalAlpha = 0.25 + 0.75 * fillAlpha;
        ctx.fillStyle = g;
        ctx.fillRect(-size, topY, size * 2, size * 2);
        ctx.restore();

        ctx.strokeStyle = fillAlpha < 0.99 ? '#f472b6' : '#fda4af';
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(label, 0, size * 0.85);
      ctx.restore();
    }

    function renderSheet() {
      ctx.fillStyle = '#0d091a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const COLS = 4;
      const W = 368;
      const H = 310;
      const SX = 22;
      const SY = 20;

      CELLS.forEach((cell, idx) => {
        const col = idx % COLS;
        const row = Math.floor(idx / COLS);
        const x = SX + col * (W + 14);
        const y = SY + row * (H + 16);
        const cx = x + W / 2;
        const cy = y + 175;

        ctx.save();
        ctx.fillStyle = 'rgba(22, 16, 42, 0.96)';
        ctx.strokeStyle = cell.color;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.roundRect(x, y, W, H, 12);
        ctx.fill();
        ctx.stroke();
        ctx.clip();

        ctx.fillStyle = cell.color;
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(cell.title, cx, y + 24);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '11px sans-serif';
        ctx.fillText(cell.sub, cx, y + 42);

        const ps = new ParticleSystem();

        if (idx === 0) {
          ps.addHitSpark(cx - 42, cy + 10, '#f43f5e', 22);
          ps.addHitSpark(cx + 42, cy - 10, '#facc15', 26);
          ps._lastBannerTextTime = 0;
          ps.addDamageText(cx + 32, cy - 52, '148!', true, '#facc15');
          ps.update(0.05);
          ps.draw(ctx);
        } else if (idx === 1) {
          if (typeof ps.addParryClash === 'function') ps.addParryClash(cx, cy + 10, '#f472b6');
          ps.update(0.06);
          ps.draw(ctx);
          ctx.fillStyle = '#f9a8d4';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('🛡️ PERFECT PARRY!', cx, cy - 68);
        } else if (idx === 2) {
          // Double-Slash X-Cross & Rose Sword Crescent Arc
          ctx.save();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 5;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.moveTo(cx - 95, cy - 45);
          ctx.lineTo(cx - 15, cy + 45);
          ctx.moveTo(cx - 15, cy - 45);
          ctx.lineTo(cx - 95, cy + 45);
          ctx.stroke();

          ctx.strokeStyle = '#f472b6';
          ctx.shadowColor = '#f472b6';
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.arc(cx + 42, cy + 2, 54, -Math.PI * 0.45, Math.PI * 0.45);
          ctx.stroke();
          ctx.restore();
          ps.addHitSpark(cx - 55, cy, '#38bdf8', 16);
          ps.addHitSpark(cx + 85, cy, '#f472b6', 16);
          ps.update(0.04);
          ps.draw(ctx);
        } else if (idx === 3) {
          if (typeof ps.addHeavyLanding === 'function') ps.addHeavyLanding(cx, cy + 35, '#fb923c');
          ps.addShockwaveRing(cx, cy + 35, 110, '#fb923c', 4.5);
          ps.update(0.08);
          ps.draw(ctx);
        } else if (idx === 4) {
          // 4 Spinel Heart states showing gradual HP/DEF drain -> blacked out -> healed
          drawSpinelGem(ctx, x + 55,  cy - 5, 36, 1.00, false, '100% FULL');
          drawSpinelGem(ctx, x + 140, cy - 5, 36, 0.62, false, '62% DRAIN');
          drawSpinelGem(ctx, x + 225, cy - 5, 36, 0.25, false, '25% LOW');
          drawSpinelGem(ctx, x + 312, cy - 5, 36, 0.00, true,  '0% BLACKED');
          ctx.fillStyle = '#fbcfe8';
          ctx.font = '11px sans-serif';
          ctx.fillText('High HP/DEF dims Spinel Gem slowly; Healing refills life!', cx, y + 278);
        } else if (idx === 5) {
          ps.addSparkle(cx, cy, '#facc15', 18, 6);
          ps.update(0.04);
          ps.draw(ctx);
          const badges = [
            ['⚡ SUPER EFFECTIVE! (2x)', cx, cy - 52, '#facc15'],
            ['⚡ OVERLOAD (0.9s STUN)', cx - 78, cy + 4, '#38bdf8'],
            ['🔥 SCORCHED (BURN DoT)', cx + 78, cy + 4, '#fb923c'],
            ['💧 SOAKED (-28% SPEED)', cx, cy + 56, '#60a5fa']
          ];
          badges.forEach(([txt, bx, by, bcol]) => {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
            ctx.strokeStyle = bcol;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(bx - 76, by - 14, 152, 24, 6);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = bcol;
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(txt, bx, by + 2);
          });
        } else if (idx === 6) {
          ps.addPoof(cx - 45, cy, '#a855f7');
          ps.update(0.08);
          ps.draw(ctx);
          // Bubbled gem core
          ctx.save();
          ctx.fillStyle = 'rgba(244, 114, 182, 0.28)';
          ctx.strokeStyle = '#f9a8d4';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(cx + 55, cy, 34, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.moveTo(cx + 55, cy - 16);
          ctx.lineTo(cx + 71, cy);
          ctx.lineTo(cx + 55, cy + 16);
          ctx.lineTo(cx + 39, cy);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        } else if (idx === 7) {
          // Pink Overdrive / Dual Fusion Gem Surge Cut-in Rays
          ctx.save();
          ctx.translate(cx, cy);
          for (let r = 0; r < 12; r++) {
            ctx.rotate(Math.PI / 6);
            ctx.fillStyle = r % 2 === 0 ? 'rgba(244, 114, 182, 0.32)' : 'rgba(192, 132, 252, 0.18)';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-14, -105);
            ctx.lineTo(14, -105);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
          ps.addSparkle(cx, cy, '#ffffff', 22, 7);
          ps.update(0.04);
          ps.draw(ctx);
          ctx.fillStyle = '#fbcfe8';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('🌟 DUAL FUSION GEM SURGE! (2.5X) 🌟', cx, cy + 72);
        } else if (idx === 8) {
          const hero = new PlayerHero(600, 'p2', 2600);
          hero.switchCharacter('pearl');
          hero.x = cx;
          hero.y = cy + 82;
          hero.isFallen = true;
          hero.reviveDuration = 18.0;
          hero.reformDuration = 3.0;
          hero.reviveTimer = 1.5;
          hero.poofAnimTime = 3.5;
          try { hero.drawFallenHero(ctx); } catch (e) {}
        } else if (idx === 9) {
          // Homeworld yellow destabilizer field
          ctx.save();
          const dg = ctx.createLinearGradient(cx - 50, cy - 85, cx + 50, cy + 85);
          dg.addColorStop(0, 'rgba(250, 204, 21, 0.18)');
          dg.addColorStop(0.5, 'rgba(250, 204, 21, 0.48)');
          dg.addColorStop(1, 'rgba(250, 204, 21, 0.18)');
          ctx.fillStyle = dg;
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 2.5;
          ctx.fillRect(cx - 55, cy - 80, 110, 160);
          ctx.strokeRect(cx - 55, cy - 80, 110, 160);
          for (let ly = -60; ly <= 60; ly += 30) {
            ctx.beginPath();
            ctx.moveTo(cx - 52, cy + ly);
            ctx.lineTo(cx - 18, cy + ly - 8);
            ctx.lineTo(cx + 18, cy + ly + 8);
            ctx.lineTo(cx + 52, cy + ly);
            ctx.stroke();
          }
          ctx.restore();
        } else if (idx === 10) {
          // Boss Threat Aura + Homing Corruption Orbs
          ctx.save();
          const ag = ctx.createRadialGradient(cx - 25, cy + 5, 10, cx - 25, cy + 5, 78);
          ag.addColorStop(0, 'rgba(220, 38, 38, 0.65)');
          ag.addColorStop(0.6, 'rgba(147, 51, 234, 0.35)');
          ag.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = ag;
          ctx.beginPath();
          ctx.arc(cx - 25, cy + 5, 78, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // Homing orbs
          [[cx + 68, cy - 35], [cx + 85, cy + 15], [cx + 58, cy + 55]].forEach(([ox, oy]) => {
            ctx.fillStyle = '#a855f7';
            ctx.beginPath();
            ctx.arc(ox, oy, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(ox, oy, 6, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        } else if (idx === 11) {
          // Dodge Dash After-Image silhouettes + Bounce Pad
          const hero = new PlayerHero(600, 'p1', 2600);
          hero.switchCharacter('garnet');
          [0.2, 0.45, 0.85].forEach((alpha, gIdx) => {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(cx - 70 + gIdx * 45, cy + 55);
            ctx.scale(1.15, 1.15);
            hero.drawGarnet(ctx, 0, 0.5, 'j');
            ctx.restore();
          });
          ps.addSparkle(cx + 45, cy, '#4ade80', 18, 6);
          ps.update(0.04);
          ps.draw(ctx);
          ctx.fillStyle = '#4ade80';
          ctx.font = 'bold 13px sans-serif';
          ctx.fillText('★ I-FRAME DASH & SUPER BOUNCE!', cx, cy - 68);
        }

        ctx.restore();
      });
    }

    renderSheet();
  });
  </script>
</body>
</html>
