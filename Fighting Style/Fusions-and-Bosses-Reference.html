<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Gems! — All 9 Canon Fusions &amp; Terrifying Bosses Showcase</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0d0919; color: #f8fafc;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .header {
    text-align: center; padding: 18px 24px 12px;
    background: linear-gradient(180deg, rgba(168,85,247,0.22) 0%, rgba(13,9,25,0) 100%);
    border-bottom: 1px solid rgba(192,132,252,0.3);
  }
  .header h1 { margin: 0; font-size: 25px; letter-spacing: 1.4px; color: #e879f9; }
  .header p { margin: 5px 0 0; font-size: 13px; color: #cbd5e1; }
  #fbCanvas {
    display: block; margin: 14px auto 24px;
    border-radius: 14px; border: 1px solid rgba(148,163,184,0.22);
    background: #110c22;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>💎 CRYSTAL GEMS! — ALL 9 CANON FUSIONS &amp; TERRIFYING BOSSES SHOWCASE</h1>
    <p>Cel-Inked Limbs &amp; Faces • Signature Fusion Flourishes • Lore Fusion RPG Stats • Fractured Phase-2 Boss Auras &amp; 6 Unpredictable Patterns</p>
  </div>
  <canvas id="fbCanvas" width="1560" height="1060"></canvas>

  <script>window.__suGameInitialized = true;</script>
  <script src="../src/game.js"></script>
  <script>
  window.addEventListener('load', () => {
    const canvas = document.getElementById('fbCanvas');
    const ctx = canvas.getContext('2d');
    const hero = new PlayerHero(600, 'p1', 2600);
    const mgr = new EnemyManager(1280, 600);

    const FUSIONS = [
      { id: 'stevonnie',      name: 'STEVONNIE',         fn: 'drawStevonnie',            color: '#f472b6' },
      { id: 'smoky',          name: 'SMOKY QUARTZ',      fn: 'drawSmokyQuartz',          color: '#fb923c' },
      { id: 'rainbow2',       name: 'RAINBOW QUARTZ 2.0',fn: 'drawRainbowQuartz2',       color: '#38bdf8' },
      { id: 'sunstone',       name: 'SUNSTONE',          fn: 'drawSunstone',             color: '#facc15' },
      { id: 'sugilite',       name: 'SUGILITE',          fn: 'drawSugilite',             color: '#a855f7' },
      { id: 'sardonyx',       name: 'SARDONYX',          fn: 'drawSardonyx',             color: '#fb7185' },
      { id: 'opal',           name: 'OPAL',              fn: 'drawOpal',                 color: '#818cf8' },
      { id: 'malachite',      name: 'MALACHITE',         fn: 'drawMalachite',            color: '#2dd4bf' },
      { id: 'rainbowClassic', name: 'RAINBOW (CLASSIC)', fn: 'drawRainbowQuartzClassic', color: '#e879f9' }
    ];

    ctx.fillStyle = '#0e0a1c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#f0abfc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('1. ALL 9 PLAYABLE CANON FUSIONS (CEL-INKED SILHOUETTES, SIGNATURE FLOURISHES & AMPLIFIED LORE STATS)', 26, 28);

    const COLS = 5, CW = 296, CH = 300;
    FUSIONS.forEach((f, idx) => {
      const col = idx % COLS;
      const row = Math.floor(idx / COLS);
      const x = 24 + col * (CW + 8);
      const y = 42 + row * (CH + 10);

      ctx.save();
      ctx.fillStyle = 'rgba(24, 18, 46, 0.96)';
      ctx.strokeStyle = f.color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(x, y, CW, CH, 12);
      ctx.fill();
      ctx.stroke();
      ctx.clip();

      const rad = ctx.createRadialGradient(x + CW / 2, y + 128, 8, x + CW / 2, y + 128, 86);
      rad.addColorStop(0, f.color + '44');
      rad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rad;
      ctx.fillRect(x, y, CW, CH);

      hero.isFusion = true;
      hero.fusionData = { id: f.id, name: f.name, color: f.color, glowColor: f.color };
      ctx.save();
      ctx.translate(x + CW / 2, y + 200);
      ctx.scale(1.42, 1.42);
      try {
        if (typeof hero[f.fn] === 'function') hero[f.fn](ctx, 0, 0.5, 'j');
        if (typeof hero.drawFusionSignatureFlourish === 'function') hero.drawFusionSignatureFlourish(ctx, f.id, 0, 0.5);
      } catch (e) {}
      ctx.restore();
      hero.isFusion = false;

      ctx.fillStyle = f.color;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.name, x + CW / 2, y + 22);

      const st = (typeof FUSION_STATS !== 'undefined' && FUSION_STATS[f.id]) || { hp: 240, attack: 60, magic: 60, defense: 55, critChance: 0.22, critDamage: 1.85 };
      const pills = [
        [`HP: ${st.hp}`, '#f43f5e'], [`ATK: ${st.attack}`, '#fb923c'], [`MAG: ${st.magic}`, '#38bdf8'],
        [`DEF: ${st.defense}`, '#4ade80'], [`CRIT: ${Math.round(st.critChance * 100)}%`, '#facc15'], [`CDMG: ${Math.round(st.critDamage * 100)}%`, '#c084fc']
      ];
      pills.forEach(([txt, colHex], pIdx) => {
        const px = x + 16 + (pIdx % 3) * 90;
        const py = y + 222 + Math.floor(pIdx / 3) * 34;
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath();
        ctx.roundRect(px, py, 84, 26, 5);
        ctx.fill();
        ctx.fillStyle = colHex;
        ctx.font = 'bold 11px monospace';
        ctx.fillText(txt, px + 42, py + 17);
      });
      ctx.restore();
    });

    // 10th card in row 2: Summary card of 6 Boss Patterns
    {
      const x = 24 + 4 * (CW + 8), y = 42 + (CH + 10);
      ctx.save();
      ctx.fillStyle = 'rgba(38, 14, 30, 0.96)';
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(x, y, CW, CH, 12);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('6 UNPREDICTABLE BOSS PATTERNS', x + CW / 2, y + 26);
      const pats = [
        '1. Multi-Angle Barrage Volley',
        '2. Meteor Pounce + Dual Shockwaves',
        '3. Corruption Blink Ambush',
        '4. Tracking Homing Corruption Orbs',
        '5. 360° Radial Shard Nova',
        '6. Phase-2 Shadow-Feint + Sky Rain'
      ];
      ctx.textAlign = 'left';
      ctx.font = '12px sans-serif';
      pats.forEach((line, i) => {
        ctx.fillStyle = i >= 4 ? '#fde047' : '#e2e8f0';
        ctx.fillText(line, x + 22, y + 66 + i * 36);
      });
      ctx.restore();
    }

    // Section 2: 4 Iconic Terrifying Bosses
    ctx.fillStyle = '#fca5a5';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('2. TERRIFYING PHASE-2 BOSSES (FRACTURED CORRUPTION AURAS, ORBITING SHARDS & GROUND FISSURES)', 26, 686);

    const BOSSES = [
      { title: 'MOTHER CENTIPEETLE', type: 'boss_centipeetle', fn: 'drawMotherCentipeetle', col: '#22c55e' },
      { title: 'CORRUPTED JASPER',   type: 'boss_jasper',      fn: 'drawCorruptedJasper',   col: '#f97316' },
      { title: 'CLUSTER TITAN',      type: 'boss_cluster_titan', fn: 'drawClusterMutant',   col: '#c084fc' },
      { title: 'ICE GUARDIAN BOSS',  type: 'boss_ice_guardian',  fn: 'drawIceMonster',      col: '#38bdf8' }
    ];

    BOSSES.forEach((b, idx) => {
      const bx = 24 + idx * 380, by = 702, bw = 368, bh = 336;
      ctx.save();
      ctx.fillStyle = 'rgba(22, 12, 32, 0.98)';
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 12);
      ctx.fill();
      ctx.stroke();
      ctx.clip();

      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.title, bx + bw / 2, by + 24);

      // Phase-2 Crimson/Purple Threat Aura + Jagged Spikes
      const cx = bx + bw / 2, cy = by + 200;
      const g = ctx.createRadialGradient(cx, cy, 12, cx, cy, 125);
      g.addColorStop(0, 'rgba(239, 68, 68, 0.48)');
      g.addColorStop(0.55, b.col + '33');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, 125, 0, Math.PI * 2);
      ctx.fill();

      const e = {
        type: b.type, x: 0, y: 0, facing: -1, width: 120, height: 135, hp: 500, maxHp: 1500,
        animTime: 1.5, hurtTimer: 0, gemColor: b.col, movementType: 'walk',
        isBoss: true, isElite: true, windup: 0.2, attackCooldown: 1.25, attackTimer: 0.4,
        name: b.title, vx: 0, vy: 0, phase2: true
      };
      ctx.save();
      ctx.translate(cx, by + 292);
      ctx.scale(idx >= 2 ? 2.2 : 1.15, idx >= 2 ? 2.2 : 1.15);
      try {
        if (typeof mgr[b.fn] === 'function') mgr[b.fn](ctx, e);
      } catch (err) {}
      ctx.restore();

      ctx.restore();
    });
  });
  </script>
</body>
</html>
