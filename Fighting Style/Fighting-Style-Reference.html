<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Gems! — Complete Characters, Fusions, Corrupted Gems &amp; Bosses Roster</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0a1a;
    color: #f8fafc;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .header {
    text-align: center;
    padding: 18px 24px 12px;
    background: linear-gradient(180deg, rgba(244,114,182,0.18) 0%, rgba(13,10,26,0) 100%);
    border-bottom: 1px solid rgba(244,114,182,0.3);
  }
  .header h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 1.5px;
    color: #f472b6;
    text-shadow: 0 2px 12px rgba(244,114,182,0.45);
  }
  .header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #cbd5e1;
  }
  #fightingCanvas {
    display: block;
    margin: 12px auto 20px;
    border-radius: 14px;
    border: 1px solid rgba(148,163,184,0.24);
    box-shadow: 0 12px 38px rgba(0,0,0,0.65);
    background: #110d22;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>💎 CRYSTAL GEMS! — COMPLETE HEROES, FUSIONS, CORRUPTED GEMS &amp; BOSSES ROSTER</h1>
    <p>All 10 Playable Guardians • All 9 Canon Fusions • Corrupted Gem Minions &amp; Terrifying Phase-2 Bosses • Elemental Move Types &amp; Lore RPG Stats</p>
  </div>
  <canvas id="fightingCanvas" width="1560" height="1980"></canvas>

  <script>window.__suGameInitialized = true;</script>
  <script src="../src/game.js"></script>
  <script>
  window.__renderSheet = () => {
    const canvas = document.getElementById('fightingCanvas');
    const ctx = canvas.getContext('2d');
    const hero = new PlayerHero(600, 'p1', 2600);
    const mgr = new EnemyManager(1280, 600);

    const ROSTER = [
      { id: 'steven',   title: 'STEVEN UNIVERSE',       weapon: 'Rose Shield & Bubble',     pose: 'attack', fn: 'drawSteven',   color: '#f472b6' },
      { id: 'garnet',   title: 'GARNET',                weapon: 'Electro Gauntlets',        pose: 'attack', fn: 'drawGarnet',   color: '#e11d48' },
      { id: 'amethyst', title: 'AMETHYST',              weapon: 'Dual Quartz Whips',        pose: 'attack', fn: 'drawAmethyst', color: '#a855f7' },
      { id: 'pearl',    title: 'PEARL',                 weapon: 'Precision Spear & Holo',   pose: 'attack', fn: 'drawPearl',    color: '#38bdf8' },
      { id: 'bismuth',  title: 'BISMUTH',               weapon: 'Forge Hammer Slam',        pose: 'attack', fn: 'drawBismuth',  color: '#7dd3fc' },
      { id: 'peridot',  title: 'PERIDOT',               weapon: 'Ferrokinesis & EMP',       pose: 'attack', fn: 'drawPeridot',  color: '#4ade80' },
      { id: 'lapis',    title: 'LAPIS LAZULI',          weapon: 'Hydrokinesis Wings',       pose: 'attack', fn: 'drawLapis',    color: '#2563eb' },
      { id: 'rose',     title: 'ROSE QUARTZ',           weapon: 'Rose Broadsword & Heal',   pose: 'attack', fn: 'drawRose',     color: '#fb7185' },
      { id: 'connie',   title: 'CONNIE (PINK REVIVED)', weapon: 'Rose Sword & Pink Form',   pose: 'pink',   fn: 'drawConnie',   color: '#f9a8d4' },
      { id: 'jasper',   title: 'JASPER',                weapon: 'Crash Helmet Charge',      pose: 'attack', fn: 'drawJasper',   color: '#f59e0b' }
    ];

    const FUSIONS = [
      { id: 'stevonnie',      title: 'STEVONNIE',          pair: 'Steven + Connie',   fn: 'drawStevonnie',            color: '#f472b6', types: ['normal', 'fight', 'fairy'] },
      { id: 'smoky',          title: 'SMOKY QUARTZ',       pair: 'Steven + Amethyst', fn: 'drawSmokyQuartz',          color: '#fb923c', types: ['fight', 'dark', 'flying'] },
      { id: 'rainbow2',       title: 'RAINBOW QUARTZ 2.0', pair: 'Steven + Pearl',    fn: 'drawRainbowQuartz2',       color: '#38bdf8', types: ['fairy', 'psychic', 'flying'] },
      { id: 'sunstone',       title: 'SUNSTONE',           pair: 'Steven + Garnet',   fn: 'drawSunstone',             color: '#facc15', types: ['fire', 'fight', 'fairy'] },
      { id: 'sugilite',       title: 'SUGILITE',           pair: 'Garnet + Amethyst', fn: 'drawSugilite',             color: '#a855f7', types: ['dark', 'fight', 'dragon'] },
      { id: 'sardonyx',       title: 'SARDONYX',           pair: 'Garnet + Pearl',    fn: 'drawSardonyx',             color: '#fb7185', types: ['psychic', 'electr', 'fire'] },
      { id: 'opal',           title: 'OPAL',               pair: 'Amethyst + Pearl',  fn: 'drawOpal',                 color: '#818cf8', types: ['psychic', 'flying', 'fairy'] },
      { id: 'malachite',      title: 'MALACHITE',          pair: 'Lapis + Jasper',    fn: 'drawMalachite',            color: '#2dd4bf', types: ['water', 'dragon', 'dark'] },
      { id: 'rainbowClassic', title: 'RAINBOW (CLASSIC)',  pair: 'Rose + Pearl',      fn: 'drawRainbowQuartzClassic', color: '#e879f9', types: ['fairy', 'psychic', 'fight'] },
      { id: 'connie_normal',  title: 'CONNIE MAHESWARAN',  pair: 'Human Swordfighter',fn: 'drawConnie',               color: '#38bdf8', types: ['normal', 'fight', 'normal'], isHeroConnie: true }
    ];

    const ENEMIES_AND_BOSSES = [
      { title: 'CENTIPEETLE & FLYER',     sub: 'Corrupted Acid Spitter Pack',      type: 'centipeetle',       type2: 'winged_centipeetle', col: '#22c55e', elem: 'DARK / FLYING',   hp: 'HP: 75–95' },
      { title: 'BLADE QUARTZ & HARPY',    sub: 'Corrupted Warrior & Sky Hunter',   type: 'blade_quartz',      type2: 'spire_harpy',        col: '#f43f5e', elem: 'FIGHT / FLYING',  hp: 'HP: 110–130' },
      { title: 'ICE MONSTER & FIREBIRD',  sub: 'Glacial & Volcanic Corruptions',   type: 'ice_monster',       type2: 'volcanic_firebird',  col: '#38bdf8', elem: 'WATER / FIRE',    hp: 'HP: 120–145' },
      { title: 'CLUSTER & ROBONOID',      sub: 'Forced-Fusion & Homeworld Tech',   type: 'cluster',           type2: 'robonoid_scout',     col: '#a855f7', elem: 'DARK / STEEL',    hp: 'HP: 105–150' },
      { title: 'MOTHER CENTIPEETLE',      sub: 'Episode 1 Boss • Acid Brood Queen',type: 'boss_centipeetle',  isBoss: true, scale: 0.92,   col: '#4ade80', elem: 'BOSS • DARK',     hp: 'HP: 1,500+' },
      { title: 'CORRUPTED QUARTZ BEAST',  sub: 'Episode 2/3 Boss • Horned Behemoth',type: 'boss_quartz_beast',isBoss: true, scale: 0.98,   col: '#38bdf8', elem: 'BOSS • FIGHT',    hp: 'HP: 1,850+' },
      { title: 'CLUSTER TITAN & CORE',    sub: 'Episode 4 Boss • Amalgamation',    type: 'boss_cluster_titan',isBoss: true, scale: 0.92,   col: '#c084fc', elem: 'BOSS • DARK/PSY', hp: 'HP: 2,200+' },
      { title: 'FORGE & ICE GUARDIANS',   sub: 'Episode 5/6 Boss • Elemental Titans',type: 'boss_forge_guardian',type2: 'boss_ice_guardian', isBoss: true, scale: 0.85, col: '#f97316', elem: 'BOSS • FIRE/STEEL', hp: 'HP: 2,400+' },
      { title: 'CORRUPTED JASPER BOSS',   sub: 'Episode 6 Climax • Alpha Quartz',  type: 'boss_jasper',       isBoss: true, scale: 1.05,   col: '#fb923c', elem: 'BOSS • FIGHT/DRG',hp: 'HP: 2,750+' },
      { title: 'WHITE DIAMOND (ERA 3)',   sub: 'Episode 10 Final Boss • Homeworld',type: 'boss_white_diamond',isBoss: true, scale: 0.86,   col: '#e2e8f0', elem: 'FINAL • PSY/STL', hp: 'HP: 3,600+' }
    ];

    function drawStatsCard(x, y, w, h, item, stats, moveTypes, drawEntityFn) {
      ctx.save();
      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, 'rgba(30, 23, 56, 0.96)');
      grad.addColorStop(1, 'rgba(17, 13, 34, 0.99)');
      ctx.fillStyle = grad;
      ctx.strokeStyle = item.color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 12);
      ctx.fill();
      ctx.stroke();
      ctx.clip();

      const rad = ctx.createRadialGradient(x + w / 2, y + 120, 8, x + w / 2, y + 120, 84);
      rad.addColorStop(0, item.color + '44');
      rad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rad;
      ctx.fillRect(x + 8, y + 28, w - 16, 165);

      drawEntityFn(x + w / 2, y + 178);

      ctx.fillStyle = item.color;
      ctx.font = 'bold 13.5px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(item.title, x + w / 2, y + 21);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '11px sans-serif';
      ctx.fillText(item.weapon || item.pair || '', x + w / 2, y + 36);

      ['j', 'k', 'l'].forEach((slot, sIdx) => {
        const mType = moveTypes[slot] || 'fight';
        const meta = (typeof TYPE_META !== 'undefined' && TYPE_META[mType]) || { label: mType.toUpperCase(), color: '#38bdf8' };
        const bx = x + 16 + sIdx * 90;
        const by = y + 194;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.strokeStyle = meta.color;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(bx, by, 84, 21, 5);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = meta.color;
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`[${slot.toUpperCase()}] ${meta.label}`, bx + 42, by + 14);
      });

      const statList = [
        [`HP: ${stats.hp}`, '#f43f5e'],
        [`ATK: ${stats.attack}`, '#fb923c'],
        [`MAG: ${stats.magic}`, '#38bdf8'],
        [`DEF: ${stats.defense}`, '#4ade80'],
        [`CRIT: ${Math.round(stats.critChance * 100)}%`, '#facc15'],
        [`CDMG: ${Math.round(stats.critDamage * 100)}%`, '#c084fc']
      ];
      statList.forEach(([label, colHex], stIdx) => {
        const sx = x + 16 + (stIdx % 3) * 90;
        const sy = y + 223 + Math.floor(stIdx / 3) * 31;
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath();
        ctx.roundRect(sx, sy, 84, 24, 5);
        ctx.fill();
        ctx.fillStyle = colHex;
        ctx.font = 'bold 10.5px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(label, sx + 42, sy + 16);
      });
      ctx.restore();
    }

    ctx.fillStyle = '#0f0b1e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const COLS = 5, CARD_W = 296, CARD_H = 292, START_X = 24;

    // 1. ALL 10 PLAYABLE GUARDIANS
    ctx.fillStyle = '#fbcfe8';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('1. ALL 10 PLAYABLE GUARDIANS (SHOW-ACCURATE CEL MODELS, ELEMENTAL MOVES & LORE RPG STATS)', 26, 28);

    ROSTER.forEach((item, idx) => {
      const col = idx % COLS, row = Math.floor(idx / COLS);
      const x = START_X + col * (CARD_W + 8);
      const y = 40 + row * (CARD_H + 8);
      const moves = (typeof HERO_MOVE_TYPES !== 'undefined' && HERO_MOVE_TYPES[item.id]) || { j: 'fight', k: 'fight', l: 'fairy' };
      const st = (typeof CHARACTER_STATS !== 'undefined' && CHARACTER_STATS[item.id]) || { hp: 120, attack: 35, magic: 35, defense: 30, critChance: 0.15, critDamage: 1.6 };
      drawStatsCard(x, y, CARD_W, CARD_H, item, st, moves, (cx, cy) => {
        hero.switchCharacter(item.id);
        hero.isFusion = false;
        hero.isPinkRevived = (item.pose === 'pink');
        hero.isAttacking = false;
        hero.attackType = null;
        hero.attackCombo = 0;
        ctx.save();
        ctx.translate(cx, cy + 10);
        ctx.scale(1.24, 1.24);
        try {
          hero[item.fn](ctx, 0, 0, 'idle');
          if (typeof hero.drawHeroSignatureFlourish === 'function') hero.drawHeroSignatureFlourish(ctx, item.id, 0, 0.5);
        } catch (e) {}
        ctx.restore();
        hero.isPinkRevived = false;
      });
    });

    // 2. ALL 9 PLAYABLE CANON FUSIONS (+ NORMAL CONNIE)
    const SEC2_Y = 662;
    ctx.fillStyle = '#f0abfc';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('2. ALL 9 PLAYABLE CANON FUSIONS (2-PLAYER TAG-TEAM HARMONY FUSIONS & AMPLIFIED LORE STATS)', 26, SEC2_Y);

    FUSIONS.forEach((f, idx) => {
      const col = idx % COLS, row = Math.floor(idx / COLS);
      const x = START_X + col * (CARD_W + 8);
      const y = SEC2_Y + 12 + row * (CARD_H + 8);
      const moves = { j: f.types[0], k: f.types[1], l: f.types[2] };
      const st = f.isHeroConnie
        ? ((typeof CHARACTER_STATS !== 'undefined' && CHARACTER_STATS.connie) || { hp: 105, attack: 38, magic: 18, defense: 24, critChance: 0.36, critDamage: 2.05 })
        : ((typeof FUSION_STATS !== 'undefined' && FUSION_STATS[f.id]) || { hp: 245, attack: 60, magic: 60, defense: 55, critChance: 0.25, critDamage: 1.9 });
      drawStatsCard(x, y, CARD_W, CARD_H, f, st, moves, (cx, cy) => {
        ctx.save();
        ctx.translate(cx, cy + 10);
        ctx.scale(1.18, 1.18);
        try {
          if (f.isHeroConnie) {
            hero.switchCharacter('connie');
            hero.isFusion = false;
            hero.isPinkRevived = false;
            hero.drawConnie(ctx, 0, 0, 'idle');
          } else {
            hero.isFusion = true;
            hero.fusionData = { id: f.id, name: f.title, color: f.color, glowColor: f.color };
            if (typeof hero[f.fn] === 'function') hero[f.fn](ctx, 0, 0, 'idle');
            if (typeof hero.drawFusionSignatureFlourish === 'function') hero.drawFusionSignatureFlourish(ctx, f.id, 0, 0.5);
            hero.isFusion = false;
          }
        } catch (e) {}
        ctx.restore();
      });
    });

    // 3. CORRUPTED GEMS & TERRIFYING BOSSES BESTIARY
    const SEC3_Y = 1286;
    ctx.fillStyle = '#fca5a5';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('3. CORRUPTED GEM MINIONS & TERRIFYING PHASE-2 BOSSES (FRACTURED AURAS, ELEMENTAL TYPINGS & HP)', 26, SEC3_Y);

    ENEMIES_AND_BOSSES.forEach((eb, idx) => {
      const col = idx % COLS, row = Math.floor(idx / COLS);
      const x = START_X + col * (CARD_W + 8);
      const y = SEC3_Y + 12 + row * (322 + 10);
      const h = 322;

      ctx.save();
      ctx.fillStyle = eb.isBoss ? 'rgba(28, 12, 34, 0.98)' : 'rgba(20, 16, 40, 0.96)';
      ctx.strokeStyle = eb.isBoss ? '#ef4444' : eb.col;
      ctx.lineWidth = eb.isBoss ? 1.9 : 1.5;
      ctx.beginPath();
      ctx.roundRect(x, y, CARD_W, h, 12);
      ctx.fill();
      ctx.stroke();
      ctx.clip();

      const cx = x + CARD_W / 2, cy = y + 165;
      const rad = ctx.createRadialGradient(cx, cy, 10, cx, cy, eb.isBoss ? 115 : 80);
      rad.addColorStop(0, eb.isBoss ? 'rgba(239, 68, 68, 0.44)' : (eb.col + '38'));
      rad.addColorStop(0.6, eb.col + '22');
      rad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rad;
      ctx.beginPath();
      ctx.arc(cx, cy, eb.isBoss ? 115 : 80, 0, Math.PI * 2);
      ctx.fill();

      if (eb.isBoss) {
        // Jagged Phase-2 corruption spikes behind boss
        ctx.strokeStyle = 'rgba(248, 113, 113, 0.55)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let sp = 0; sp < 10; sp++) {
          const ang = (Math.PI * 2 * sp) / 10;
          ctx.moveTo(cx + Math.cos(ang) * 42, cy + Math.sin(ang) * 42);
          ctx.lineTo(cx + Math.cos(ang) * 86, cy + Math.sin(ang) * 86);
        }
        ctx.stroke();
      }

      const makeE = (tName) => ({
        type: tName, x: 0, y: 0, facing: 1, width: 95, height: 110, hp: 500, maxHp: 1500,
        animTime: 1.35, hurtTimer: 0, gemColor: eb.col, movementType: 'walk',
        isBoss: !!eb.isBoss, isElite: !!eb.isBoss, windup: 0.15, attackCooldown: 1.25, attackTimer: 0.4,
        name: eb.title, vx: 0, vy: 0, phase2: !!eb.isBoss
      });

      if (eb.type2) {
        ctx.save();
        ctx.translate(cx - 58, y + 235);
        ctx.scale(eb.scale || 1.15, eb.scale || 1.15);
        try { mgr.drawEnemyModel(ctx, makeE(eb.type)); } catch (err) {}
        ctx.restore();

        ctx.save();
        ctx.translate(cx + 58, y + 235);
        ctx.scale(eb.scale || 1.15, eb.scale || 1.15);
        try { mgr.drawEnemyModel(ctx, makeE(eb.type2)); } catch (err) {}
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(cx - (eb.type === 'boss_centipeetle' ? 18 : 0), y + 244);
        const s = eb.scale || 1.1;
        ctx.scale(s, s);
        try { mgr.drawEnemyModel(ctx, makeE(eb.type)); } catch (err) {}
        ctx.restore();
      }

      ctx.fillStyle = eb.isBoss ? '#f87171' : eb.col;
      ctx.font = 'bold 13.5px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(eb.title, cx, y + 22);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '11px sans-serif';
      ctx.fillText(eb.sub, cx, y + 38);

      // Footer type & HP pills
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = eb.col;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(x + 16, y + 278, 148, 28, 6);
      ctx.roundRect(x + 172, y + 278, 108, 28, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = eb.col;
      ctx.font = 'bold 10.5px monospace';
      ctx.fillText(eb.elem, x + 90, y + 296);
      ctx.fillStyle = '#facc15';
      ctx.fillText(eb.hp, x + 226, y + 296);

      ctx.restore();
    });
  };
  window.__renderSheet();
  window.addEventListener('load', window.__renderSheet);
  </script>
</body>
</html>
